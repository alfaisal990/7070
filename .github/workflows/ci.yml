name: Phoenix AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python Code
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          # Run remaining warnings as non-blocking style checks
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv

  test:
    name: Run Test Suites
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest fastapi httpx pytest-anyio sqlalchemy passlib python-multipart python-jose[cryptography] cryptography bcrypt pydantic-settings torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Main Test Suite
        env:
          SECRET_KEY: "supersecretkeychangeinproduction12345"
          JWT_SECRET_KEY: "supersecretkeychangeinproduction12345"
        run: |
          python -m pytest tests/

      - name: Run Task Manager Test Suite
        env:
          SECRET_KEY: "supersecretkeychangeinproduction12345"
          JWT_SECRET_KEY: "supersecretkeychangeinproduction12345"
        run: |
          python -m pytest task_manager/tests/

      - name: Run Phoenix Tasks Backend Test Suite
        env:
          SECRET_KEY: "supersecretkeychangeinproduction12345"
          JWT_SECRET_KEY: "supersecretkeychangeinproduction12345"
        run: |
          python -m pytest phoenix_tasks/backend/tests/

  build:
    name: Verify Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: ai_project/dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ai_project/dashboard
        run: npm ci

      - name: Build Frontend Application
        working-directory: ai_project/dashboard
        run: npm run build

      - name: Build Docker Backend Image (Dry Run)
        run: docker build -f Dockerfile.backend -t phoenix-backend:latest .

      - name: Build Docker Frontend Image (Dry Run)
        run: docker build -f Dockerfile.frontend -t phoenix-frontend:latest .

